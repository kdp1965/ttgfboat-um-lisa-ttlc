# Tiny Tapeout project information
project:
  title:        "LISA Microcontroller (GF180)"
  author:       "Ken Pettit"
  discord:      "busy_courgette_50064"
  description:  "8-Bit Microcontroller SOC - the ttsky26d LISA (revision 3) on GF180, without the BF16 unit and the TTLC"
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     22222222       # 45 ns (Ken, 2026-10-28, GF180.md): the layout meets 45 ns at the typical corners with 0.4-2.5 ns to spare (gf20)

  # How many tiles your design occupies? A GF180 1x1 tile is about 347x161 uM.
  tiles: "4x4"          # 1440.32 x 736.96 um, the largest GF180 tile (valid: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4, 4x4)

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_pettit_lisa"

  # List your project's source files here. Source files must be in ./src and you must list each source file separately, one per line:
  source_files:
    - "tt_um_pettit_lisa.v"
    - "RAM32.v"
    - "lisa_core.v"
    - "lisa_dbg.v"
    - "lisa_div.v"
    - "lisa_periph.v"
    - "lisa_io_mux.v"
    - "lisa_qqspi.v"
    - "lisa_qspi_controller.v"
    - "lisa_rx8n.v"
    - "lisa_tx8n.v"
    - "lisa_i2c.v"
    - "lisa_spi.v"
    - "lisa_ttlcio.v"
    - "lisa_timer3.v"
    - "lisa_ws2812.v"
    - "lisa_cyccnt.v"
    - "lisa_wdt.v"
    - "debug_ctrl.v"
    - "debug_autobaud.v"
    - "debug_brg.v"
    - "debug_regs.v"
    - "data_cache8.v"
    - "inst_stream.v"
    - "i2c_master_byte_ctrl.v"
    - "i2c_master_bit_ctrl.v"
    - "lisa_uart.v"
    - "ttlc_io.v"
    - "ttlc_fetch.v"
    - "mc14500b.v"
    - "shift_reg_io.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "pa[0]/b_div[0]/rx2/miso"
  ui[1]: "pa[1]/b_div[1]/rx2/miso"
  ui[2]: "pa[2]/b_div[2]/rx2/miso"
  ui[3]: "pa[3]/b_div[3]/rx"
  ui[4]: "pa[4]/b_div[4]/t3_cap0"
  ui[5]: "pa[5]/b_div[5]/t3_cap1"
  ui[6]: "pa[6]/b_div[6]"
  ui[7]: "pa[7]/b_set(autobaud_disable)/miso"

  # Outputs
  uo[0]: "pb[0]/tx2/ttlc_d0/m3_mosi/ws"
  uo[1]: "pb[1]/tx2/pwm0/ttlc_d1/m3_cs0/ws"
  uo[2]: "pb[2]/tx2/pwm1/ttlc_d2/m3_cs1/ws"
  uo[3]: "pb[3]/spi_cs0"
  uo[4]: "pb[4]/tx"
  uo[5]: "pb[5]/spi_sclk/ws"
  uo[6]: "pb[6]/spi_mosi/ws"
  uo[7]: "pb[7]/baud_clk/spi_cs1/m3_sclk"

  # Bidirectional pins
  uio[0]: "ce0/ce_latch"
  uio[1]: "mosi/dq1/ce0_latch"
  uio[2]: "miso/dq2/ce1_latch"
  uio[3]: "sclk"
  uio[4]: "rx  /pc_io[0]/scl/ce1"
  uio[5]: "tx  /pc_io[1]/sda"
  uio[6]: "scl /pc_io[2]/dq2/rx"
  uio[7]: "sda/pc_io[3]/dq3"

# Do not change!
yaml_version: 6
